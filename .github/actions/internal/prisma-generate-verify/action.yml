# Verifies Prisma generate against a job-level PostgreSQL service container and
# fails if committed generated artifacts are out of date.

name: Verify Prisma generate
description: Migrate and generate Prisma artifacts, then assert generated output matches git.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 10.28.2

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22.23.3
        cache: pnpm

    - name: Install dependencies from pnpm lockfile
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Apply database migrations
      shell: bash
      env:
        DATABASE_URL: postgresql://grades:gradespassword123@localhost:5432/grades
      run: pnpm -F @grades/db prisma migrate deploy

    - name: Generate Prisma client and TypedSQL
      shell: bash
      env:
        DATABASE_URL: postgresql://grades:gradespassword123@localhost:5432/grades
      run: pnpm -F @grades/db generate

    - name: Fail if generated Prisma artifacts are out of date
      shell: bash
      run: git diff --exit-code packages/db/generated
