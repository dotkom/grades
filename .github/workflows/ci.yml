# The main integration pipeline
#
# It is responsible for verifying linting, type checking, testing, and building packages.

name: CI & CD
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  id-token: write
  contents: read

jobs:
  verify-quality-checks:
    name: Lint, type check, and unit tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            packages/db/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ hashFiles('packages/db/src/**', 'packages/db/generated/**') }}
          restore-keys: tsbuildinfo-
      - run: pnpm install --frozen-lockfile
        name: Install dependencies from pnpm lockfile
      - run: pnpm lint-check
        name: Linting and formatting checks
      - run: pnpm prisma-schema-lint-check
        name: Prisma schema lint
      - run: pnpm type-check
        name: TypeScript type checker
      - run: pnpm test
        name: Unit tests

  test-integration:
    name: Integration tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        name: Install dependencies from pnpm lockfile
      - run: pnpm test:it
        name: Run integration tests

  verify-prisma-generate:
    name: Verify Prisma generate
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16-alpine@sha256:b7587f3cb74f4f4b2a4f9d67f052edbf95eb93f4fec7c5ada3792546caaf7383
        env:
          POSTGRES_USER: grades
          POSTGRES_PASSWORD: gradespassword123
          POSTGRES_DB: grades
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grades -d grades"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/internal/prisma-generate-verify

  build-backend:
    name: backend
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install local GitHub Actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          sparse-checkout: '.github'
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/build-backend
        with:
          deploy: false
          environment: prd
          git-hash: ${{ github.sha }}

  build-frontend:
    name: frontend
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install local GitHub Actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          sparse-checkout: '.github'
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/build-frontend
        with:
          deploy: false
          environment: prd
          git-hash: ${{ github.sha }}
